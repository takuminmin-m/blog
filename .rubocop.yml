# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# House rules (see "Conventions" in CLAUDE.md). Omakase only enforces layout and a few
# style rules; these departments add cops that catch bugs and Rails pitfalls instead.
AllCops:
  NewCops: enable

Lint:
  Enabled: true

Rails:
  Enabled: true

Security:
  Enabled: true
